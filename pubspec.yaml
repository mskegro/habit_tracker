name: gamified_habit_tracker
description: A gamified mobile app for habit tracking with XP, streaks, and achievements
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  
  
  google_sign_in: ^6.2.2
  
  provider: ^6.1.2
  
  shared_preferences: ^2.3.3
  
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  
  cupertino_icons: ^1.0.8
  
  fl_chart: ^0.69.2
  
  lottie: ^3.1.3
  
  confetti: ^0.7.0
  flutter_colorpicker: ^1.0.3

  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: "assets/images/app_icon.png"